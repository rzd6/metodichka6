<!--
  ==========================================================================
  ФОРУМНЫЙ СНИППЕТ — РУКОВОДЯЩИЙ И СТАРШИЙ СОСТАВ РЖД
  Вставьте этот блок в тему на форуме (поддерживает HTML).
  Данные загружаются автоматически из методички через публичный API.

  Замените YOUR_DOMAIN на реальный домен методички, например:
  https://metodichka6.vercel.app
  ==========================================================================
-->
<div id="rzd-staff-block">
  <style>
    #rzd-staff-block {
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }
    .rzd-section-title {
      font-size: 28px;
      font-weight: 900;
      color: #ff6666;
      text-align: center;
      letter-spacing: 2px;
      text-shadow: 0 0 20px rgba(255,102,102,0.3);
      margin-bottom: 10px;
    }
    .rzd-cards-row {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .rzd-card {
      background-color: #1a1a2e;
      border-radius: 12px;
      padding: 20px 25px;
      width: 320px;
      border: 2px solid #ff6666;
      box-shadow: 0 4px 15px rgba(255,102,102,0.3);
      box-sizing: border-box;
    }
    .rzd-card-name {
      font-size: 22px;
      font-weight: bold;
      color: #ffffff;
      margin-bottom: 4px;
    }
    .rzd-card-name.vacant {
      color: rgba(255,255,255,0.4);
      font-style: italic;
    }
    .rzd-card-position {
      font-size: 13px;
      color: #ff6666;
      margin-bottom: 15px;
    }
    .rzd-card-divider {
      border-top: 1px solid #333;
      margin-bottom: 15px;
    }
    .rzd-card-rank-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .rzd-card-rank-label {
      font-size: 13px;
      color: #888;
    }
    .rzd-card-rank-value {
      font-size: 16px;
      font-weight: bold;
      color: #ff6666;
    }
    .rzd-loading {
      color: #888;
      font-size: 14px;
      text-align: center;
      padding: 20px;
    }
    @keyframes rzd-gradient {
      0%   { background-position: 0% 50%; }
      50%  { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    .rzd-animated-name {
      background: linear-gradient(90deg, #ff0000, #ff1744, #ff5252, #ff8a80, #ff4081, #f50057, #c51162, #ff1744, #ff0000);
      background-size: 300% 100%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: rzd-gradient 6s ease-in-out infinite;
      display: inline-block;
    }
  </style>

  <div class="rzd-loading" id="rzd-loading-indicator">Загрузка состава...</div>
  <div id="rzd-content" style="display:none; flex-direction:column; align-items:center; gap:20px; width:100%;"></div>
</div>

<script>
(function() {
  // === НАСТРОЙКИ ===
  var API_URL = "https://metodichka-rzd6.vercel.app/api/public/staff";
  // Никнеймы Генерального директора (будут иметь анимированное имя)
  var ANIMATED_NICKNAMES = ["Artem_Darmin"];

  // Порядок должностей и ранг для группировки
  var LEADERSHIP_POSITIONS = [
    { title: "Генеральный директор",                          positionTitle: "Главный следящий за РЖД",                            rank: 9 },
    { title: "Помощник Генерального Директора",               positionTitle: "Помощник Главного Следящего",                        rank: 9 },
    { title: "Начальник Депо",                                positionTitle: "Начальник Депо",                                     rank: 9 },
  ];

  var SENIOR_POSITIONS = [
    { title: "Первый Заместитель Начальника Депо",            positionTitle: "Первый Заместитель Начальника Депо",                 rank: 8 },
    { title: "Зам. Начальника Депо по кадровой работе",       positionTitle: "Заместитель Начальника Депо по кадровой работе",     rank: 8 },
    { title: "Зам. Начальника Депо по эксплуатации",          positionTitle: "Заместитель Начальника Депо по эксплуатации",        rank: 8 },
    { title: "Начальник Экзаменационного отдела",             positionTitle: "Начальник ЭО",                                       rank: 7 },
    { title: "Начальник ЦдУД",                                positionTitle: "Начальник ЦдУД",                                     rank: 7 },
    { title: "Начальник ПТО",                                 positionTitle: "Начальник ПТО",                                      rank: 7 },
    { title: "Зам. Начальника Экзаменационного отдела",       positionTitle: "Машинист-инструктор/Зам.Нач.ЭО",                    rank: 6 },
    { title: "Заместитель Начальника ЦдУД",                   positionTitle: "Машинист-инструктор/Зам.Нач.ЦдУД",                  rank: 6 },
    { title: "Заместитель Начальника ПТО",                    positionTitle: "Машинист-инструктор/Зам.Нач.ПТО",                   rank: 6 },
  ];

  function makeCard(posEntry, username) {
    var vacant = !username;
    var nameClass = "rzd-card-name" + (vacant ? " vacant" : "");
    var animated = !vacant && ANIMATED_NICKNAMES.indexOf(username) !== -1;

    var nameHtml;
    if (animated) {
      nameHtml = '<span class="rzd-animated-name">' + username + '</span>';
    } else {
      nameHtml = vacant ? "Вакантно" : username;
    }

    return '<div class="rzd-card">'
      + '<div class="' + nameClass + '">' + nameHtml + '</div>'
      + '<div class="rzd-card-position">' + posEntry.title + '</div>'
      + '<div class="rzd-card-divider"></div>'
      + '<div class="rzd-card-rank-row">'
      +   '<span class="rzd-card-rank-label">РАНГ</span>'
      +   '<span class="rzd-card-rank-value">' + posEntry.rank + '</span>'
      + '</div>'
      + '</div>';
  }

  function groupByRank(positions, staffMap) {
    var groups = {};
    positions.forEach(function(p) {
      if (!groups[p.rank]) groups[p.rank] = [];
      groups[p.rank].push(p);
    });
    var html = "";
    Object.keys(groups).sort(function(a,b){ return b - a; }).forEach(function(rank) {
      html += '<div class="rzd-cards-row">';
      groups[rank].forEach(function(p) {
        var username = staffMap[p.positionTitle] || null;
        html += makeCard(p, username);
      });
      html += '</div>';
    });
    return html;
  }

  fetch(API_URL)
    .then(function(r) { return r.json(); })
    .then(function(json) {
      var rows = json.data || [];

      // Build map: positionTitle -> username
      var staffMap = {};
      rows.forEach(function(row) {
        if (row.positionTitle) {
          staffMap[row.positionTitle] = row.username;
        }
      });

      var content = document.getElementById("rzd-content");
      var html = "";

      html += '<div class="rzd-section-title">Руководящий Состав</div>';
      html += groupByRank(LEADERSHIP_POSITIONS, staffMap);

      html += '<div class="rzd-section-title" style="margin-top:30px;">Старший Состав</div>';
      html += groupByRank(SENIOR_POSITIONS, staffMap);

      content.innerHTML = html;
      content.style.display = "flex";
      document.getElementById("rzd-loading-indicator").style.display = "none";
    })
    .catch(function(err) {
      document.getElementById("rzd-loading-indicator").innerHTML =
        '<span style="color:#ff6666;">Ошибка загрузки данных. Обновите страницу.</span>';
    });
})();
</script>
